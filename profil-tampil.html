<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Profil Tersimpan</title>

	<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: linear-gradient(135deg, #fff5f7, #f1edff);
			color: #4b3f50;
			font-family: "Nunito", sans-serif;
		}

		nav {
			padding: 18px 7%;
			background: rgba(255, 255, 255, 0.85);
			border-bottom: 1px solid #f0e4ef;
		}

		nav ul {
			display: flex;
			justify-content: flex-end;
			align-items: center;
			gap: 28px;
			list-style: none;
			margin: 0;
			padding: 0;
		}

		nav a {
			color: #6e5878;
			text-decoration: none;
			font-weight: 800;
		}

		nav a:hover {
			color: #d16d9c;
		}

		.page {
			width: min(900px, 90%);
			margin: 50px auto;
		}

		.heading {
			text-align: center;
			margin-bottom: 28px;
		}

		.eyebrow {
			display: inline-block;
			padding: 7px 15px;
			border-radius: 30px;
			background: #f9dce9;
			color: #9d5579;
			font-size: 13px;
			font-weight: 800;
			letter-spacing: 1px;
			text-transform: uppercase;
		}

		h1 {
			margin: 14px 0 10px;
			color: #594466;
			font-family: "Playfair Display", serif;
			font-size: clamp(32px, 5vw, 46px);
		}

		.intro {
			margin: 0;
			color: #88788e;
			line-height: 1.7;
		}

		.profile-card {
			overflow: hidden;
			background: #fff;
			border: 1px solid #f0e4ef;
			border-radius: 26px;
			box-shadow: 0 18px 45px rgba(105, 75, 112, 0.12);
		}

		.card-header {
			padding: 28px;
			text-align: center;
			background: linear-gradient(135deg, #f8dce9, #e9e1fb);
		}

		.avatar {
			display: grid;
			place-items: center;
			width: 88px;
			height: 88px;
			margin: 0 auto 14px;
			border: 5px solid rgba(255, 255, 255, 0.85);
			border-radius: 50%;
			background: #fff;
			font-size: 38px;
			box-shadow: 0 8px 20px rgba(105, 75, 112, 0.12);
		}

		.card-header h2 {
			margin: 0;
			color: #594466;
			font-family: "Playfair Display", serif;
			font-size: 25px;
		}

		.card-body {
			padding: 30px;
		}

		.profile-details {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 16px;
			margin: 0;
		}

		.detail {
			padding: 17px 18px;
			border: 1px solid #f0e4ef;
			border-radius: 15px;
			background: #fffafd;
			overflow-wrap: anywhere;
		}

		.detail.full {
			grid-column: 1 / -1;
		}

		.detail dt {
			margin-bottom: 7px;
			color: #9d6b91;
			font-size: 12px;
			font-weight: 800;
			letter-spacing: 1px;
			text-transform: uppercase;
		}

		.detail dd {
			margin: 0;
			color: #594466;
			font-weight: 700;
			line-height: 1.7;
			white-space: pre-wrap;
		}

		.empty-state {
			padding: 28px;
			text-align: center;
			color: #88788e;
			line-height: 1.7;
		}

		.actions {
			display: flex;
			justify-content: center;
			gap: 12px;
			flex-wrap: wrap;
			margin-top: 25px;
		}

		.button {
			display: inline-block;
			padding: 12px 22px;
			border: 0;
			border-radius: 30px;
			background: linear-gradient(135deg, #d982a9, #a88bd1);
			color: #fff;
			font: inherit;
			font-weight: 800;
			text-decoration: none;
			cursor: pointer;
			transition: transform 0.2s, box-shadow 0.2s;
			box-shadow: 0 8px 18px rgba(168, 139, 209, 0.25);
		}

		.button:hover {
			transform: translateY(-2px);
			box-shadow: 0 11px 22px rgba(168, 139, 209, 0.32);
		}

		.button.secondary {
			background: #fff;
			color: #9d5579;
			border: 1px solid #e9d8ed;
			box-shadow: none;
		}

		footer {
			padding: 24px 7%;
			text-align: center;
			color: #8a7c90;
			font-size: 14px;
		}

		@media (max-width: 600px) {
			nav {
				padding: 16px 5%;
			}

			nav ul {
				justify-content: center;
				gap: 22px;
			}

			.page {
				margin: 32px auto;
			}

			.card-body {
				padding: 20px;
			}

			.profile-details {
				grid-template-columns: 1fr;
			}

			.detail.full {
				grid-column: auto;
			}

			.actions {
				flex-direction: column;
			}

			.button {
				text-align: center;
			}
		}
	</style>
</head>

<body>
	<nav>
		<ul>
			<li><a href="index.html#contact">Contact</a></li>
			<li><a href="profil.html">Profil</a></li>
			<li>
				<a href="https://www.instagram.com/aurell_ponamon?exln=MzNlNGNkZWQ4Mg=="
				   target="_blank"
				   rel="noopener noreferrer">Instagram</a>
			</li>
		</ul>
	</nav>

	<main class="page">
		<header class="heading">
			<span class="eyebrow">Data profil</span>
			<h1>Profil Tersimpan</h1>
			<p class="intro">Berikut ringkasan data profil yang kamu simpan.</p>
		</header>

		<section class="profile-card" aria-live="polite">
			<div class="card-header">
				<div class="avatar" aria-hidden="true">🌷</div>
				<h2 id="namaJudul">Profil Saya</h2>
			</div>

			<div class="card-body">
				<div id="profilResult">
					<div class="empty-state">
						Data belum tersedia. Silakan isi formulir profil terlebih dahulu.
					</div>
				</div>

				<div class="actions">
					<a href="profil.html" class="button">Kembali ke Form</a>
					<a href="index.html" class="button secondary">Halaman Utama</a>
				</div>
			</div>
		</section>
	</main>

	<footer>
		<p>✨ Dibuat oleh Aurel, terinspirasi dari kisah Rapunzel ✨</p>
	</footer>

	<script>
		const hasil = document.getElementById("profilResult");
		const namaJudul = document.getElementById("namaJudul");

		function aman(teks) {
			return String(teks ?? "").replace(/[&<>"']/g, function(karakter) {
				return {
					"&": "&amp;",
					"<": "&lt;",
					">": "&gt;",
					'"': "&quot;",
					"'": "&#039;"
				}[karakter];
			});
		}

		try {
			const data = JSON.parse(localStorage.getItem("profil"));

			if (data && data.nama) {
				namaJudul.textContent = data.nama;

				hasil.innerHTML = `
					<dl class="profile-details">
						<div class="detail">
							<dt>NIM</dt>
							<dd>${aman(data.nim)}</dd>
						</div>
						<div class="detail">
							<dt>Nama</dt>
							<dd>${aman(data.nama)}</dd>
						</div>
						<div class="detail full">
							<dt>Alamat</dt>
							<dd>${aman(data.alamat)}</dd>
						</div>
						<div class="detail">
							<dt>Hobi</dt>
							<dd>${aman(data.hobi)}</dd>
						</div>
						<div class="detail">
							<dt>Instagram</dt>
							<dd>${aman(data.instagram)}</dd>
						</div>
					</dl>
				`;
			}
		} catch (error) {
			hasil.innerHTML = `
				<div class="empty-state">
					Data profil belum dapat dibaca. Silakan isi dan simpan formulir kembali.
				</div>
			`;
		}
	</script>
</body>
</html>
